<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stand-up Timer</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/nf-sauce-code-pro@2.1.3/nf-font.min.css">
  <link rel="stylesheet" href="styles.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<body>
  <div id="timer-container">
    <div id="countdown-text">Stand-up begins in...</div>
    <div id="timer">02:00</div>
  </div>

  <script>
    $(document).ready(function() {
      let totalSeconds = 12; // 2 minutes
      const timerElement = $('#timer');
      const countdownTextElement = $('#countdown-text');

      const updateTimer = () => {
        if (totalSeconds <= 0) {
          clearInterval(interval);
          countdownTextElement.hide();
          timerElement.text('Who wants to start?');
          return;
        }

        const minutes = Math.floor(totalSeconds / 60).toString().padStart(2, '0');
        const seconds = (totalSeconds % 60).toString().padStart(2, '0');
        timerElement.text(`${minutes}:${seconds}`);
        totalSeconds--;
      };

      updateTimer(); // Initial display
      const interval = setInterval(updateTimer, 1000);
    });
  </script>
</body>
</html>

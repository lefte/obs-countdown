<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stand-up Timer - 8:30 AM Central</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/nf-sauce-code-pro@2.1.3/nf-font.min.css">
  <link rel="stylesheet" href="styles.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<body>
  <div id="timer-container">
    <div id="countdown-text">Stand-up begins in...</div>
    <div id="timer">Calculating...</div>
  </div>

  <script>
    $(document).ready(function() {
      const timerElement = $('#timer');
      const countdownTextElement = $('#countdown-text');

      const getTargetTime = () => {
        const now = new Date();
        // Get current time in Central Time
        const centralTime = new Date(now.toLocaleString("en-US", {timeZone: "America/Chicago"}));

        // Create target time for 8:30 AM Central today
        const target = new Date(centralTime);
        target.setHours(8, 30, 0, 0);

        // If we've already passed 8:30 AM today, target tomorrow's 8:30 AM
        if (centralTime >= target) {
          target.setDate(target.getDate() + 1);
        }

        return target;
      };

      // Calculate target time once at page load
      const targetTime = getTargetTime();

      const updateTimer = () => {
        const now = new Date();
        // Get current time in Central Time
        const centralTime = new Date(now.toLocaleString("en-US", {timeZone: "America/Chicago"}));

        const timeDifference = targetTime - centralTime;

        if (timeDifference <= 0) {
          clearInterval(interval);
          countdownTextElement.hide();
          timerElement.text('Who wants to start? \udb86\udd89');
          return;
        }

        const totalSeconds = Math.floor(timeDifference / 1000);
        const hours = Math.floor(totalSeconds / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;

        let timeString;
        if (hours > 0) {
          timeString = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        } else {
          timeString = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        timerElement.text(timeString);
      };

      updateTimer(); // Initial display
      const interval = setInterval(updateTimer, 1000);
    });
  </script>
</body>
</html>
